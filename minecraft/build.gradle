plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}


loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs "--username", (System.getenv("HOLLOWCRAFT_USERNAME") ?: "Semibot")
			// Keep the normal3GB heap target, with headroom for tall-chunk allocation bursts.
			vmArgs "--enable-native-access=ALL-UNNAMED", "-Dhollowcraft.quitWithHost=false", "-Dhollowcraft.startHidden=true", "-Xmx6G", "-XX:+UseZGC", "-XX:SoftMaxHeapSize=3G"
			if (System.getenv('HOLLOWCRAFT_TEST_MODE') == '1') vmArgs '-Dhollowcraft.testMode=true', '-Xlog:gc::time,uptime'
			// A second (guest) client on this PC, next to the Prism one: HOLLOWCRAFT_LINK=Local\HollowCraft_guest
			if (System.getenv("HOLLOWCRAFT_LINK")) {
				vmArg "-Dhollowcraft.link=" + System.getenv("HOLLOWCRAFT_LINK")
			}
		}
	}

	mods {
		"hollowcraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "failed"; exceptionFormat "full" }
}

processResources {
	from('../assets/steve') { into 'assets/hollowcraft/steve'; exclude 'void-hand-*' }
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("../LICENSE") {
		rename { "${it}_$projectName"}
	}
}
